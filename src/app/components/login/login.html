<div class="login-container">
  <div class="login-card">
    <div class="header">
      <div class="brand-icon">
        <i class="fas fa-map"></i>
      </div>
      <h2>STERIÁ<span></span></h2>
      <p>Ingrese sus credenciales de acceso</p>
    </div>

    <form (submit)="ingresar()">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="user" [(ngModel)]="creds.email" placeholder="Correo electrónico" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-wrapper">
          <input [type]="verPassword ? 'text' : 'password'" name="pass" [(ngModel)]="creds.password" required>
          <button type="button" class="password-toggle" (click)="verPassword = !verPassword" [title]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="fas" [ngClass]="verPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="error" class="error-msg">
        {{ error }}
      </div>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Verificando...' : 'Acceder al Sistema' }}
      </button>
    </form>

    <!-- <p class="footer-text">© 2026 Sistema de Gestión de Redes</p> -->
  </div>
</div>
